<!doctype html>
<html lang="ja" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My News</title>
<meta name="theme-color" content="#F4F6F8">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="My News">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%232F6FD6'/%3E%3Cstop offset='1' stop-color='%237C4DFF'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='url(%23g)'/%3E%3Crect x='14' y='15' width='36' height='9' fill='%23fff'/%3E%3Crect x='14' y='30' width='36' height='4' fill='%23fff'/%3E%3Crect x='14' y='39' width='36' height='4' fill='%23fff'/%3E%3Crect x='14' y='48' width='22' height='4' fill='%23fff'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap">
<script>
// 画面を描く前にテーマを決めて、ちらつきを防ぐ
(function () {
  try {
    var m = localStorage.getItem("mynews.appearance");
    if (m !== "light" && m !== "dark") m = "auto";
    var dark = m === "dark" || (m === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute("content", dark ? "#0C1722" : "#F4F6F8");
  } catch (e) {}
})();
</script>
<style>
:root {
  --bg: #F4F6F8;
  --surface: #FFFFFF;
  --ink: #12202E;
  --muted: #5A6B7B;
  --faint: #7A8997;
  --line: #DCE2E8;
  --accent: #1B4F8A;
  --accent-soft: #E3ECF6;
  --grad: linear-gradient(135deg, #2F6FD6, #7C4DFF);
  --on-tc: #FFFFFF;
  --shadow: 0 -8px 40px rgba(18, 32, 46, .18);
  --font: "Zen Kaku Gothic New", -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif;
  --tw: 3.3rem;   /* 時刻の列 */
  --rw: 1.5rem;   /* 時間軸の列 */
  /* テーマごとの色(c = 文字・印の色、s = 淡い背景色) */
  --c0: #C23A1F; --c0s: #FDE9E4;
  --c1: #00796B; --c1s: #DDF3EF;
  --c2: #6540E0; --c2s: #ECE7FC;
  --c3: #9A5B00; --c3s: #FFF0D2;
  --c4: #C2185B; --c4s: #FBE3EE;
  --c5: #0277BD; --c5s: #DFF0FB;
  --c6: #2E7D32; --c6s: #E1F3E2;
  --c7: #3F51B5; --c7s: #E5E8F8;
  --c8: #8D4E2A; --c8s: #F6E7DD;
  --c9: #006F7A; --c9s: #D9F2F5;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #0C1722;
  --surface: #14232F;
  --ink: #E7EEF5;
  --muted: #93A5B6;
  --faint: #62758A;
  --line: #223445;
  --accent: #7DB3F0;
  --accent-soft: #17314D;
  --on-tc: #0C1722;
  --shadow: 0 -8px 40px rgba(0, 0, 0, .55);
  --c0: #FF8F73; --c0s: #3A1F1A;
  --c1: #4DD0C0; --c1s: #12332F;
  --c2: #B39DFF; --c2s: #2A2150;
  --c3: #FFC24D; --c3s: #3A2C10;
  --c4: #FF7EB6; --c4s: #3B1727;
  --c5: #5CC8FF; --c5s: #10324A;
  --c6: #7ED884; --c6s: #16331A;
  --c7: #A5B4FF; --c7s: #1E2547;
  --c8: #E3A57D; --c8s: #38261B;
  --c9: #5FD7E4; --c9s: #0F3338;
  color-scheme: dark;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { background: var(--bg); }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 400 16px/1.6 var(--font);
  font-feature-settings: "palt";
  -webkit-text-size-adjust: 100%;
  padding-bottom: env(safe-area-inset-bottom);
}
body.sheet-open, body.detail-open { overflow: hidden; }
button { font: inherit; color: inherit; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

.wrap { max-width: 640px; margin: 0 auto; padding: 0 20px; }

/* ── 見出し部 ───────────────────────── */
.masthead { position: sticky; top: 0; z-index: 10; background: var(--bg); padding-top: env(safe-area-inset-top); padding-bottom: 10px; border-bottom: 1px solid var(--line); } /* 画面上部に固定 */
.strip {
  height: 4px;
  background: linear-gradient(90deg,
    var(--c0) 0 10%, var(--c1) 10% 20%, var(--c2) 20% 30%, var(--c3) 30% 40%, var(--c4) 40% 50%,
    var(--c5) 50% 60%, var(--c6) 60% 70%, var(--c7) 70% 80%, var(--c8) 80% 90%, var(--c9) 90% 100%);
}
.mast-row { display: flex; align-items: center; gap: 4px; padding-top: 12px; }
.brand { flex: 1; display: flex; align-items: center; gap: 10px; font-weight: 900; font-size: 18px; letter-spacing: .01em; }
.logo { width: 28px; height: 28px; border-radius: 8px; background: var(--grad); display: grid; place-items: center; }
.logo svg { width: 16px; height: 16px; fill: #fff; }
.btn {
  height: 38px; min-width: 38px; padding: 0 12px; border: 0; background: transparent;
  color: var(--muted); font-size: 14px; font-weight: 500; border-radius: 10px; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
}
.btn:hover { color: var(--ink); }
.btn:active { background: var(--accent-soft); }
.btn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
#btn-settings { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
.ico-sun { display: none; }
:root[data-theme="dark"] .ico-sun { display: block; }
:root[data-theme="dark"] .ico-moon { display: none; }
.spin svg { animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.dateline { margin-top: 10px; display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 2px 16px; }
.date { margin: 0; font-size: 20px; font-weight: 900; line-height: 1.4; }
.date .wd { margin-left: 8px; font-size: 14px; font-weight: 500; color: var(--muted); }
.status { margin: 0; font-size: 12.5px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 0 12px; }

/* ── テーマの絞り込み ───────────────────────── */
.tabs { margin-top: 0; padding-top: 14px; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
#chips { display: flex; flex-wrap: wrap; gap: 8px; } /* 横にスクロールさせず、収まらない分は次の行へ */
.tab {
  display: inline-flex; align-items: center; cursor: pointer; white-space: nowrap;
  padding: 6px 13px 6px 11px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface);
  font-size: 14px; font-weight: 500; color: var(--ink);
}
.tab:first-child { padding-left: 14px; }
.tab .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--tc); margin-right: 7px; }
.tab[aria-pressed="true"] { background: var(--tcs); border-color: var(--tc); font-weight: 900; }

/* ── 記事一覧(時間軸) ───────────────────────── */
main { padding-bottom: 72px; }
.day h2 { margin: 26px 0 2px; font-size: 16px; font-weight: 900; display: flex; align-items: center; }
.day h2::before { content: ""; width: 4px; height: 16px; border-radius: 2px; background: var(--grad); margin-right: 9px; }
.row {
  position: relative; display: grid; grid-template-columns: var(--tw) var(--rw) 1fr;
  color: var(--ink); text-decoration: none;
}
.row::before { /* 時間軸の線 */
  content: ""; position: absolute; top: 0; bottom: 0; width: 1px; background: var(--line);
  left: calc(var(--tw) + var(--rw) / 2);
}
.row .rail { position: relative; padding: 0; }
.node { position: absolute; left: 50%; transform: translateX(-50%); border-radius: 50%; background: var(--tc); box-shadow: 0 0 0 4px var(--bg); }
.node.unread { top: 21px; width: 12px; height: 12px; }  /* 未読: テーマの色の点 */
.node.read { top: 17px; width: 20px; height: 20px; display: grid; place-items: center; }  /* 既読: チェック入りの丸 */
.node.read svg { width: 13px; height: 13px; fill: none; stroke: var(--on-tc); stroke-width: 3.4; stroke-linecap: round; stroke-linejoin: round; }
.row > * { padding: 14px 0; }
.row time { font-size: 13px; line-height: 26px; color: var(--muted); font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }
.row .body { grid-column: 3; border-bottom: 1px solid var(--line); }
.row:last-child .body { border-bottom: 0; }
.hl { font-size: 17px; line-height: 26px; font-weight: 700; overflow-wrap: anywhere; line-break: strict; word-break: auto-phrase; text-wrap: pretty; }
.go {
  display: inline-flex; align-items: center; gap: 5px; padding: 4px 11px; min-height: 32px;
  border: 1.5px solid var(--tc); border-radius: 999px; background: transparent; color: var(--tc);
  font: inherit; font-size: 13px; font-weight: 900; cursor: pointer;
}
.go svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.acts { margin-left: auto; display: inline-flex; align-items: center; gap: 8px; }
.acts .done, .acts .go { margin-left: 0; }
.row:active .hl { color: var(--tc); }
@media (hover: hover) { .row:hover .hl { color: var(--tc); } }
.pv {
  margin-top: 6px; font-size: 14px; line-height: 1.65; color: var(--muted);
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  line-break: strict; word-break: auto-phrase;
}
.done {
  margin-left: auto; display: inline-flex; align-items: center; gap: 5px; padding: 3px 11px 3px 8px; border-radius: 999px;
  background: var(--tc); color: var(--on-tc); font-size: 14px; font-weight: 900; line-height: 1.5;
}
.done svg { width: 18px; height: 18px; fill: none; stroke: var(--on-tc); stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
.meta { margin-top: 8px; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; font-size: 12.5px; color: var(--muted); }
.pill { display: inline-block; padding: 1px 9px; border-radius: 999px; background: var(--tcs); color: var(--tc); font-weight: 700; font-size: 12px; line-height: 1.7; }

.notice { padding: 56px 0; text-align: center; color: var(--muted); }
.notice p { margin: 0 0 16px; }
.notice .btn { border: 1px solid var(--line); color: var(--ink); }

/* ── 下から出るシート(共通) ───────────────────────── */
#sheet-back { position: fixed; inset: 0; z-index: 20; background: rgba(6, 12, 18, .5); opacity: 0; visibility: hidden; transition: opacity .2s, visibility .2s; }
body.sheet-open #sheet-back, body.detail-open #sheet-back { opacity: 1; visibility: visible; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; max-width: 640px; margin: 0 auto;
  max-height: 88vh; overflow: auto; background: var(--surface); box-shadow: var(--shadow);
  border-radius: 20px 20px 0 0; padding: 14px 20px calc(env(safe-area-inset-bottom) + 20px);
  transform: translateY(100%); visibility: hidden; transition: transform .26s cubic-bezier(.2, .8, .2, 1), visibility .26s;
}
body.sheet-open #sheet, body.detail-open #detail { transform: none; visibility: visible; }
@media (prefers-reduced-motion: reduce) { .sheet, #sheet-back { transition: none; } .spin svg { animation: none; } }
.grab { width: 44px; height: 4px; border-radius: 2px; margin: 0 auto 16px; background: var(--tc, var(--line)); }
.sheet h2 { margin: 0 0 4px; font-size: 19px; font-weight: 900; }
.sheet .hint { margin: 0 0 8px; font-size: 13px; color: var(--muted); }
.sheet h3 { margin: 24px 0 10px; font-size: 15px; font-weight: 900; }

.sheet-actions { display: flex; gap: 10px; margin-top: 22px; }
.sheet-actions > * {
  flex: 1; height: 48px; border-radius: 12px; border: 1px solid var(--line); background: transparent;
  font-size: 15px; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; text-decoration: none;
}
.sheet-actions .primary { background: var(--grad); border-color: transparent; color: #fff; font-weight: 900; }
.sheet-actions .primary-tc { background: var(--tc); border-color: transparent; color: var(--on-tc); font-weight: 900; flex: 1.6; }

/* テーマ選択 */
.opt { display: flex; align-items: center; gap: 12px; padding: 13px 0; border-top: 1px solid var(--line); cursor: pointer; }
.opt .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--tc); flex: none; }
.opt .n { margin-left: auto; font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.opt input { appearance: none; -webkit-appearance: none; order: 3; flex: none; width: 46px; height: 28px; margin: 0; border-radius: 14px; background: var(--line); position: relative; cursor: pointer; transition: background .15s; }
.opt input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .3); transition: transform .15s; }
.opt input:checked { background: var(--tc); }
.opt input:checked::after { transform: translateX(18px); }
:root[data-theme="dark"] .opt input:checked::after { background: var(--on-tc); }

.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 4px; background: var(--bg); border-radius: 12px; }
.seg button { height: 40px; border: 0; border-radius: 9px; background: transparent; color: var(--muted); font-weight: 500; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); font-weight: 900; box-shadow: 0 1px 3px rgba(0, 0, 0, .18); }
:root[data-theme="dark"] .seg button[aria-pressed="true"] { background: var(--accent-soft); box-shadow: none; }

/* 記事の概要 */
.d-top { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.d-top .pill { font-size: 12.5px; }
.d-nav { margin-left: auto; display: flex; gap: 4px; }
.d-nav button { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: transparent; cursor: pointer; display: grid; place-items: center; }
.d-nav button:disabled { opacity: .3; cursor: default; }
.d-nav svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
#d-title { font-size: 21px; line-height: 1.55; font-weight: 900; line-break: strict; word-break: auto-phrase; text-wrap: pretty; margin: 0; }
.d-meta { margin: 8px 0 0; font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 0 12px; }
.d-sum { margin: 18px 0 0; padding: 14px 16px; border-radius: 14px; background: var(--tcs); font-size: 16px; line-height: 1.9; line-break: strict; }
.d-sum.none { background: var(--bg); color: var(--muted); font-size: 14px; line-height: 1.8; }
.d-note { margin: 8px 2px 0; font-size: 12px; color: var(--faint); }
.d-rel { margin-top: 20px; }
.d-rel h3 { margin: 0 0 4px; font-size: 14px; }
.d-rel a { display: block; padding: 11px 0; border-top: 1px solid var(--line); text-decoration: none; font-size: 15px; font-weight: 500; line-height: 1.55; }
.d-rel a span { display: block; margin-top: 2px; font-size: 12.5px; color: var(--muted); font-weight: 400; }
</style>
</head>
<body>
<header class="masthead">
  <div class="strip"></div>
  <div class="wrap">
    <div class="mast-row">
      <div class="brand">
        <span class="logo"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="5"/><rect x="3" y="11" width="18" height="2"/><rect x="3" y="15" width="18" height="2"/><rect x="3" y="19" width="11" height="2"/></svg></span>
        My News
      </div>
      <button class="btn" id="btn-mode" aria-label="ライトとダークを切り替える">
        <svg class="ico-moon" viewBox="0 0 24 24"><path d="M20 14.2A8.3 8.3 0 1 1 9.8 4a6.8 6.8 0 0 0 10.2 10.2z"/></svg>
        <svg class="ico-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>
      </button>
      <button class="btn" id="btn-reload" aria-label="最新の状態に更新">
        <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v5h-5"/></svg>
      </button>
      <button class="btn" id="btn-settings">テーマ</button>
    </div>
    <div class="dateline">
      <h1 class="date"><span id="d-md"></span><span class="wd" id="d-wd"></span></h1>
      <p class="status" id="status"></p>
    </div>
  </div>
</header>

<nav class="tabs" aria-label="テーマで絞り込み"><div class="wrap"><div id="chips"></div></div></nav>

<main class="wrap" id="list"><div class="notice"><p>読み込み中…</p></div></main>

<div id="sheet-back"></div>

<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="表示の設定">
  <div class="grab"></div>
  <h2>表示するテーマ</h2>
  <p class="hint">オンにしたテーマだけが、この端末に表示されます。</p>
  <div id="opts"></div>

  <h3>表示モード</h3>
  <div class="seg" id="seg">
    <button data-m="auto">自動</button>
    <button data-m="light">ライト</button>
    <button data-m="dark">ダーク</button>
  </div>

  <div class="sheet-actions">
    <button id="btn-reset">初期設定に戻す</button>
    <button id="btn-close" class="primary">閉じる</button>
  </div>
</section>

<section class="sheet" id="detail" role="dialog" aria-modal="true" aria-label="記事の概要">
  <div class="grab"></div>
  <div class="d-top">
    <span class="pill" id="d-tag"></span>
    <div class="d-nav">
      <button id="d-prev" aria-label="前の記事"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <button id="d-next" aria-label="次の記事"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
    </div>
  </div>
  <h2 id="d-title"></h2>
  <p class="d-meta" id="d-meta"></p>
  <div id="d-sum"></div>
  <div class="d-rel" id="d-rel"></div>
  <div class="sheet-actions">
    <button id="d-close">閉じる</button>
    <a class="primary-tc" id="d-open" target="_blank" rel="noopener noreferrer">元の記事を開く</a>
  </div>
</section>

<script>
(() => {
  const LS_SEL = "mynews.selectedTopics";
  const LS_READ = "mynews.read";
  const LS_APP = "mynews.appearance";
  const TZ = "Asia/Tokyo";
  const $ = (id) => document.getElementById(id);
  let data = null;
  let selected = new Set();
  let filter = "all";
  let read = new Set();
  let appearance = "auto";
  let topicIdx = new Map();   // テーマid → 色の番号
  let view = [];              // 画面に出ている記事(新しい順)
  let rowOf = new Map();      // 記事のリンク → 行の要素
  let detailAt = -1;

  const lsGet = (k) => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } };
  const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
  const lsRaw = (k) => { try { return localStorage.getItem(k); } catch { return null; } };

  /* ── テーマごとの色 ───────────────────────── */
  function paint(el, topicId) {
    const i = (topicIdx.get(topicId) ?? 0) % 10;
    el.style.setProperty("--tc", `var(--c${i})`);
    el.style.setProperty("--tcs", `var(--c${i}s)`);
  }
  function paintAccent(el) {
    el.style.setProperty("--tc", "var(--accent)");
    el.style.setProperty("--tcs", "var(--accent-soft)");
  }

  /* ── ライト / ダーク ───────────────────────── */
  const mq = matchMedia("(prefers-color-scheme: dark)");
  function isDark() { return appearance === "dark" || (appearance === "auto" && mq.matches); }
  function applyAppearance() {
    const dark = isDark();
    document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute("content", dark ? "#0C1722" : "#F4F6F8");
    document.querySelectorAll("#seg button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.m === appearance)));
  }
  function setAppearance(m) {
    appearance = m;
    try { localStorage.setItem(LS_APP, m); } catch {}
    applyAppearance();
  }
  (function initAppearance() {
    const m = lsRaw(LS_APP);
    appearance = (m === "light" || m === "dark") ? m : "auto";
    applyAppearance();
    mq.addEventListener && mq.addEventListener("change", () => { if (appearance === "auto") applyAppearance(); });
  })();

  /* ── 日付・時刻 ───────────────────────── */
  const fmtDay = new Intl.DateTimeFormat("sv-SE", { timeZone: TZ });
  const fmtTime = new Intl.DateTimeFormat("ja-JP", { timeZone: TZ, hour: "2-digit", minute: "2-digit", hour12: false });
  const dayKey = (d) => fmtDay.format(d);
  const md = (key) => `${parseInt(key.slice(5, 7), 10)}月${parseInt(key.slice(8, 10), 10)}日`;
  function weekday(d, style) { return d.toLocaleDateString("ja-JP", { timeZone: TZ, weekday: style }); }
  function dayLabel(key) {
    const now = Date.now();
    if (key === dayKey(new Date(now))) return "今日";
    if (key === dayKey(new Date(now - 86400000))) return "昨日";
    return `${md(key)}(${weekday(new Date(key + "T12:00:00+09:00"), "short")})`;
  }
  function renderMasthead() {
    const now = new Date();
    $("d-md").textContent = md(dayKey(now));
    $("d-wd").textContent = weekday(now, "long");
  }

  /* ── データ読み込み ───────────────────────── */
  function loadState() {
    topicIdx = new Map(data.topics.map((t, i) => [t.id, i]));
    const sel = lsGet(LS_SEL);
    const ids = new Set(data.topics.map(t => t.id));
    const defaults = () => new Set(data.topics.filter(t => t.default).map(t => t.id));
    selected = Array.isArray(sel) ? new Set(sel.filter(id => ids.has(id))) : defaults();
    if (selected.size === 0) selected = defaults();
    const r = lsGet(LS_READ);
    read = new Set(Array.isArray(r) ? r.slice(-1500) : []);
  }

  const safeUrl = (u) => /^https?:\/\//i.test(u) ? u : "#";
  const topicName = (id) => (data.topics.find(t => t.id === id) || {}).name || "";
  const mainTopic = (a) => (filter !== "all" && a.topics.includes(filter)) ? filter : a.topics.find(id => selected.has(id));

  function visibleArticles() {
    return data.articles.filter(a =>
      a.topics.some(t => selected.has(t)) && (filter === "all" || a.topics.includes(filter)));
  }

  /* ── 描画 ───────────────────────── */
  function renderTabs() {
    const box = $("chips");
    box.replaceChildren();
    const mk = (id, label) => {
      const b = document.createElement("button");
      b.className = "tab";
      if (id === "all") paintAccent(b); else { paint(b, id); const d = document.createElement("span"); d.className = "dot"; b.appendChild(d); }
      b.append(label);
      b.setAttribute("aria-pressed", String(filter === id));
      b.onclick = () => { filter = id; renderTabs(); renderList(); window.scrollTo(0, 0); };
      box.appendChild(b);
    };
    mk("all", "すべて");
    data.topics.filter(t => selected.has(t.id)).forEach(t => mk(t.id, t.name));
  }

  function renderStatus(count) {
    const box = $("status");
    box.replaceChildren();
    const add = (text) => { const s = document.createElement("span"); s.textContent = text; box.appendChild(s); };
    add("最終更新 " + fmtTime.format(new Date(data.updated)));
    add(count + "件");
    const errN = Object.keys(data.errors || {}).length;
    if (errN) add(`取得できなかったテーマ ${errN}件`);
  }

  function renderList() {
    const list = $("list");
    list.replaceChildren();
    rowOf = new Map();
    view = visibleArticles();
    renderStatus(view.length);
    if (!view.length) {
      const d = document.createElement("div"); d.className = "notice";
      const p = document.createElement("p"); p.textContent = "表示できる記事がありません。「テーマ」から表示するテーマを選んでください。";
      d.appendChild(p); list.appendChild(d); return;
    }
    // 日付ごとにまとめる
    const groups = new Map();
    view.forEach((a, i) => {
      const key = a.published ? dayKey(new Date(a.published)) : "none";
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(i);
    });
    for (const [key, idxs] of groups) {
      const sec = document.createElement("section"); sec.className = "day";
      const h = document.createElement("h2"); h.textContent = key === "none" ? "日時不明" : dayLabel(key);
      sec.appendChild(h);
      for (const i of idxs) {
        const a = view[i];
        const el = document.createElement("a");
        el.className = "row" + (read.has(a.link) ? " read" : "");
        el.href = safeUrl(a.link); el.target = "_blank"; el.rel = "noopener noreferrer";
        const tag = mainTopic(a);
        paint(el, tag);
        const tm = document.createElement("time");
        if (a.published) { tm.dateTime = a.published; tm.textContent = fmtTime.format(new Date(a.published)); }
        else tm.textContent = "--:--";
        const rail = document.createElement("span"); rail.className = "rail";
        rail.appendChild(railNode(read.has(a.link)));
        const body = document.createElement("div"); body.className = "body";
        const hl = document.createElement("div"); hl.className = "hl"; hl.textContent = a.title;
        body.appendChild(hl);
        if (a.summary) { const pv = document.createElement("div"); pv.className = "pv"; pv.textContent = a.summary; body.appendChild(pv); }
        const meta = document.createElement("div"); meta.className = "meta";
        if (tag) { const s = document.createElement("span"); s.className = "pill"; s.textContent = topicName(tag); meta.appendChild(s); }
        if (a.source) { const s = document.createElement("span"); s.textContent = a.source; meta.appendChild(s); }
        const acts = document.createElement("span"); acts.className = "acts";
        if (read.has(a.link)) acts.appendChild(doneBadge());
        const go = document.createElement("button"); go.type = "button"; go.className = "go";
        go.setAttribute("aria-label", "元の記事を開く");
        go.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>元記事';
        go.addEventListener("click", (e) => {
          e.preventDefault(); e.stopPropagation();
          window.open(safeUrl(a.link), "_blank", "noopener,noreferrer");
          markRead(a);
        });
        acts.appendChild(go); meta.appendChild(acts);
        body.appendChild(meta);
        el.append(tm, rail, body);
        el.addEventListener("click", (e) => {
          if (e.metaKey || e.ctrlKey || e.shiftKey || e.button !== 0) return; // 新しいタブで開く操作はそのまま
          e.preventDefault();
          openDetail(i);
        });
        rowOf.set(a.link, el);
        sec.appendChild(el);
      }
      list.appendChild(sec);
    }
  }

  function renderOpts() {
    const counts = {};
    data.articles.forEach(a => a.topics.forEach(t => counts[t] = (counts[t] || 0) + 1));
    const box = $("opts");
    box.replaceChildren();
    data.topics.forEach(t => {
      const lab = document.createElement("label"); lab.className = "opt";
      paint(lab, t.id);
      const dot = document.createElement("span"); dot.className = "dot";
      const name = document.createElement("span"); name.textContent = t.name;
      const n = document.createElement("span"); n.className = "n"; n.textContent = (counts[t.id] || 0) + "件";
      const cb = document.createElement("input"); cb.type = "checkbox"; cb.checked = selected.has(t.id);
      cb.setAttribute("role", "switch");
      cb.onchange = () => {
        cb.checked ? selected.add(t.id) : selected.delete(t.id);
        lsSet(LS_SEL, [...selected]);
        if (filter !== "all" && !selected.has(filter)) filter = "all";
        renderTabs(); renderList();
      };
      lab.append(dot, name, n, cb);
      box.appendChild(lab);
    });
  }

  function renderAll() { renderMasthead(); renderTabs(); renderList(); renderOpts(); }

  function showError() {
    const list = $("list");
    list.replaceChildren();
    const d = document.createElement("div"); d.className = "notice";
    const p = document.createElement("p");
    p.textContent = "ニュースを読み込めませんでした。初回の更新が終わるまで、数分かかることがあります。";
    const b = document.createElement("button"); b.className = "btn"; b.textContent = "もう一度読み込む";
    b.onclick = () => load(true);
    d.append(p, b); list.appendChild(d);
  }

  async function load(initial) {
    const btn = $("btn-reload");
    btn.classList.add("spin");
    try {
      const res = await fetch("news.json?t=" + Date.now(), { cache: "no-store" });
      if (!res.ok) throw new Error(res.status);
      data = await res.json();
      loadState();
      renderAll();
    } catch (e) {
      if (initial || !data) showError();
    } finally {
      btn.classList.remove("spin");
    }
  }

  /* ── 既読 ───────────────────────── */
  function doneBadge() {
    const s = document.createElement("span"); s.className = "done";
    s.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
    s.append("既読");
    return s;
  }
  function railNode(isRead) {
    const n = document.createElement("i");
    if (isRead) {
      n.className = "node read";
      n.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
    } else n.className = "node unread";
    return n;
  }
  function markRead(a) {
    read.add(a.link); lsSet(LS_READ, [...read]);
    const row = rowOf.get(a.link);
    if (!row) return;
    row.classList.add("read");
    const rail = row.querySelector(".rail");
    if (rail) rail.replaceChildren(railNode(true));
    const acts = row.querySelector(".acts");
    if (acts && !acts.querySelector(".done")) acts.insertBefore(doneBadge(), acts.firstChild);
  }

  /* ── 記事の概要 ───────────────────────── */
  function openDetail(i) {
    const a = view[i];
    if (!a) return;
    detailAt = i;
    const tag = mainTopic(a);
    const det = $("detail");
    paint(det, tag);

    const pill = $("d-tag");
    pill.textContent = tag ? topicName(tag) : "";
    pill.style.display = tag ? "" : "none";
    $("d-title").textContent = a.title;

    const meta = $("d-meta");
    meta.replaceChildren();
    const add = (t) => { const s = document.createElement("span"); s.textContent = t; meta.appendChild(s); };
    if (a.source) add(a.source);
    if (a.published) { const d = new Date(a.published); add(`${md(dayKey(d))} ${fmtTime.format(d)}`); }

    const sum = $("d-sum");
    sum.replaceChildren();
    const box = document.createElement("div");
    if (a.summary) {
      box.className = "d-sum"; box.textContent = a.summary;
      const note = document.createElement("p"); note.className = "d-note"; note.textContent = "配信元が公開している概要を表示しています。";
      sum.append(box, note);
    } else {
      box.className = "d-sum none"; box.textContent = "この記事の概要は取得できていません。「元の記事を開く」から本文を読めます。";
      sum.append(box);
    }

    const rel = $("d-rel");
    rel.replaceChildren();
    if (a.related && a.related.length) {
      const h = document.createElement("h3"); h.textContent = "同じニュースの他の報道";
      rel.appendChild(h);
      a.related.forEach(r => {
        const l = document.createElement("a");
        l.href = safeUrl(r.link); l.target = "_blank"; l.rel = "noopener noreferrer";
        l.append(r.title);
        if (r.source) { const s = document.createElement("span"); s.textContent = r.source; l.appendChild(s); }
        rel.appendChild(l);
      });
    }

    $("d-open").href = safeUrl(a.link);
    $("d-prev").disabled = i <= 0;
    $("d-next").disabled = i >= view.length - 1;
    det.scrollTop = 0;

    // 開いたら既読にする
    markRead(a);

    document.body.classList.remove("sheet-open");
    document.body.classList.add("detail-open");
  }
  const closeDetail = () => { document.body.classList.remove("detail-open"); detailAt = -1; };

  /* ── 操作 ───────────────────────── */
  const setSheet = (open) => { if (open) closeDetail(); document.body.classList.toggle("sheet-open", open); };
  $("btn-settings").onclick = () => setSheet(true);
  $("btn-close").onclick = () => setSheet(false);
  $("sheet-back").onclick = () => { setSheet(false); closeDetail(); };
  $("d-close").onclick = closeDetail;
  $("d-prev").onclick = () => openDetail(detailAt - 1);
  $("d-next").onclick = () => openDetail(detailAt + 1);
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") { setSheet(false); closeDetail(); }
    else if (detailAt >= 0 && e.key === "ArrowLeft") openDetail(detailAt - 1);
    else if (detailAt >= 0 && e.key === "ArrowRight") openDetail(detailAt + 1);
  });
  $("btn-reload").onclick = () => load(false);
  $("btn-mode").onclick = () => setAppearance(isDark() ? "light" : "dark");
  document.querySelectorAll("#seg button").forEach(b => b.onclick = () => setAppearance(b.dataset.m));
  $("btn-reset").onclick = () => {
    try { localStorage.removeItem(LS_SEL); } catch {}
    if (data) { loadState(); filter = "all"; renderAll(); }
  };
  // ホーム画面から戻ってきたとき、10分以上たっていれば自動で更新する
  let last = Date.now();
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden && Date.now() - last > 10 * 60 * 1000) { last = Date.now(); load(false); }
  });

  renderMasthead();
  applyAppearance();
  load(true);
})();
</script>
</body>
</html>
