<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My News</title>
<meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111418" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="My News">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<style>
:root {
  --bg: #f6f7f9; --surface: #ffffff; --text: #1a1d21; --muted: #6b7280;
  --line: #e5e7eb; --accent: #0b6bcb; --accent-bg: #e6f0fb; --read: #9ca3af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111418; --surface: #1b1f25; --text: #e8eaed; --muted: #9aa3ae;
    --line: #2a2f37; --accent: #6db3ff; --accent-bg: #1d2c3f; --read: #6b7480;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { background: var(--bg); }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
  padding-bottom: env(safe-area-inset-bottom);
}
header {
  position: sticky; top: 0; z-index: 10; background: var(--bg);
  padding: calc(env(safe-area-inset-top) + 10px) 16px 0;
  border-bottom: 1px solid var(--line);
}
.bar { display: flex; align-items: center; gap: 8px; }
.bar h1 { font-size: 20px; margin: 0; flex: 1; }
.icon-btn {
  border: 1px solid var(--line); background: var(--surface); color: var(--text);
  border-radius: 10px; height: 38px; padding: 0 12px; font-size: 14px; cursor: pointer;
}
.icon-btn:active { background: var(--accent-bg); }
#updated { font-size: 12px; color: var(--muted); margin: 2px 0 8px; min-height: 18px; }
#chips {
  display: flex; gap: 8px; overflow-x: auto; padding: 0 0 10px; scrollbar-width: none;
}
#chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; border: 1px solid var(--line); background: var(--surface); color: var(--text);
  border-radius: 999px; padding: 6px 14px; font-size: 14px; cursor: pointer;
}
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
@media (prefers-color-scheme: dark) { .chip[aria-pressed="true"] { color: #08233f; } }
main { padding: 12px 16px 40px; max-width: 760px; margin: 0 auto; }
.card {
  display: block; background: var(--surface); border: 1px solid var(--line);
  border-radius: 14px; padding: 12px 14px; margin-bottom: 10px;
  color: var(--text); text-decoration: none;
}
.card:active { background: var(--accent-bg); }
.card .title { font-weight: 600; font-size: 16px; line-height: 1.45; }
.card.read .title { color: var(--read); font-weight: 500; }
.meta { display: flex; flex-wrap: wrap; gap: 4px 10px; margin-top: 6px; font-size: 12px; color: var(--muted); }
.tag { color: var(--accent); }
.empty { text-align: center; color: var(--muted); padding: 48px 0; }

/* 設定シート */
#sheet-back { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: none; z-index: 20; }
#sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; display: none;
  background: var(--surface); border-radius: 18px 18px 0 0; max-height: 80vh; overflow: auto;
  padding: 16px 16px calc(env(safe-area-inset-bottom) + 20px);
  max-width: 760px; margin: 0 auto;
}
body.sheet-open #sheet, body.sheet-open #sheet-back { display: block; }
#sheet h2 { font-size: 17px; margin: 0 0 4px; }
#sheet p { font-size: 13px; color: var(--muted); margin: 0 0 12px; }
.opt { display: flex; align-items: center; gap: 12px; padding: 12px 4px; border-top: 1px solid var(--line); font-size: 16px; }
.opt input { width: 22px; height: 22px; accent-color: var(--accent); }
.opt span.n { margin-left: auto; font-size: 12px; color: var(--muted); }
.sheet-actions { display: flex; gap: 10px; margin-top: 14px; }
.sheet-actions button { flex: 1; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--text); font-size: 15px; }
.sheet-actions .primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
@media (prefers-color-scheme: dark) { .sheet-actions .primary { color: #08233f; } }
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1>My News</h1>
    <button class="icon-btn" id="btn-reload" aria-label="再読み込み">更新</button>
    <button class="icon-btn" id="btn-settings" aria-label="テーマを選ぶ">テーマ</button>
  </div>
  <div id="updated"></div>
  <div id="chips" role="group" aria-label="テーマで絞り込み"></div>
</header>
<main id="list"><div class="empty">読み込み中…</div></main>

<div id="sheet-back"></div>
<section id="sheet" role="dialog" aria-label="テーマ選択">
  <h2>表示するテーマ</h2>
  <p>チェックしたテーマだけがこの端末に表示されます。選択はブラウザに保存されます。</p>
  <div id="opts"></div>
  <div class="sheet-actions">
    <button id="btn-reset">初期設定に戻す</button>
    <button id="btn-close" class="primary">完了</button>
  </div>
</section>

<script>
(() => {
  const LS_SEL = "mynews.selectedTopics";
  const LS_READ = "mynews.read";
  const $ = (id) => document.getElementById(id);
  let data = null;           // news.json
  let selected = new Set();  // 表示するテーマ id
  let filter = "all";        // チップで絞り込み中のテーマ id
  let read = new Set();

  const lsGet = (k) => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } };
  const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };

  function loadState() {
    const sel = lsGet(LS_SEL);
    const ids = new Set(data.topics.map(t => t.id));
    if (Array.isArray(sel)) {
      selected = new Set(sel.filter(id => ids.has(id)));
    } else {
      selected = new Set(data.topics.filter(t => t.default).map(t => t.id));
    }
    if (selected.size === 0) selected = new Set(data.topics.filter(t => t.default).map(t => t.id));
    const r = lsGet(LS_READ);
    read = new Set(Array.isArray(r) ? r.slice(-1500) : []);
  }

  function relTime(iso) {
    if (!iso) return "";
    const diff = (Date.now() - new Date(iso).getTime()) / 1000;
    if (diff < 60) return "たった今";
    if (diff < 3600) return Math.floor(diff / 60) + "分前";
    if (diff < 86400) return Math.floor(diff / 3600) + "時間前";
    if (diff < 86400 * 7) return Math.floor(diff / 86400) + "日前";
    return new Date(iso).toLocaleDateString("ja-JP");
  }

  function safeUrl(u) { return /^https?:\/\//i.test(u) ? u : "#"; }

  function renderChips() {
    const box = $("chips");
    box.replaceChildren();
    const mk = (id, label) => {
      const b = document.createElement("button");
      b.className = "chip"; b.textContent = label;
      b.setAttribute("aria-pressed", String(filter === id));
      b.onclick = () => { filter = id; renderChips(); renderList(); window.scrollTo(0, 0); };
      box.appendChild(b);
    };
    mk("all", "すべて");
    data.topics.filter(t => selected.has(t.id)).forEach(t => mk(t.id, t.name));
  }

  function renderList() {
    const names = Object.fromEntries(data.topics.map(t => [t.id, t.name]));
    const list = $("list");
    list.replaceChildren();
    const items = data.articles.filter(a =>
      a.topics.some(t => selected.has(t)) && (filter === "all" || a.topics.includes(filter)));
    if (!items.length) {
      const d = document.createElement("div");
      d.className = "empty"; d.textContent = "表示できる記事がありません";
      list.appendChild(d); return;
    }
    for (const a of items) {
      const el = document.createElement("a");
      el.className = "card" + (read.has(a.link) ? " read" : "");
      el.href = safeUrl(a.link); el.target = "_blank"; el.rel = "noopener noreferrer";
      const t = document.createElement("div"); t.className = "title"; t.textContent = a.title;
      const m = document.createElement("div"); m.className = "meta";
      const parts = [];
      const tag = a.topics.find(id => selected.has(id));
      if (tag) { const s = document.createElement("span"); s.className = "tag"; s.textContent = names[tag]; parts.push(s); }
      if (a.source) { const s = document.createElement("span"); s.textContent = a.source; parts.push(s); }
      const tm = relTime(a.published);
      if (tm) { const s = document.createElement("span"); s.textContent = tm; parts.push(s); }
      parts.forEach(p => m.appendChild(p));
      el.append(t, m);
      el.addEventListener("click", () => {
        read.add(a.link); lsSet(LS_READ, [...read]); el.classList.add("read");
      });
      list.appendChild(el);
    }
  }

  function renderUpdated() {
    const u = new Date(data.updated);
    const jst = u.toLocaleString("ja-JP", { timeZone: "Asia/Tokyo", month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" });
    const errN = Object.keys(data.errors || {}).length;
    $("updated").textContent = "最終更新 " + jst + "(" + relTime(data.updated) + ")" + (errN ? ` ・取得失敗 ${errN}件` : "");
  }

  function renderOpts() {
    const counts = {};
    data.articles.forEach(a => a.topics.forEach(t => counts[t] = (counts[t] || 0) + 1));
    const box = $("opts");
    box.replaceChildren();
    data.topics.forEach(t => {
      const lab = document.createElement("label"); lab.className = "opt";
      const cb = document.createElement("input"); cb.type = "checkbox"; cb.checked = selected.has(t.id);
      cb.onchange = () => {
        cb.checked ? selected.add(t.id) : selected.delete(t.id);
        lsSet(LS_SEL, [...selected]);
        if (filter !== "all" && !selected.has(filter)) filter = "all";
        renderChips(); renderList();
      };
      const name = document.createElement("span"); name.textContent = t.name;
      const n = document.createElement("span"); n.className = "n"; n.textContent = (counts[t.id] || 0) + "件";
      lab.append(cb, name, n);
      box.appendChild(lab);
    });
  }

  function renderAll() { renderUpdated(); renderChips(); renderList(); renderOpts(); }

  async function load(initial) {
    try {
      const res = await fetch("news.json?t=" + Date.now(), { cache: "no-store" });
      if (!res.ok) throw new Error(res.status);
      data = await res.json();
      loadState();
      renderAll();
    } catch (e) {
      if (initial) $("list").innerHTML = '<div class="empty">ニュースを読み込めませんでした。<br>(まだ初回の更新が終わっていない可能性があります)</div>';
    }
  }

  const setSheet = (open) => document.body.classList.toggle("sheet-open", open);
  $("btn-settings").onclick = () => setSheet(true);
  $("btn-close").onclick = () => setSheet(false);
  $("sheet-back").onclick = () => setSheet(false);
  $("btn-reload").onclick = () => load(false);
  $("btn-reset").onclick = () => {
    try { localStorage.removeItem(LS_SEL); } catch {}
    loadState(); filter = "all"; renderAll();
  };
  // ホーム画面から戻ってきたとき、10分以上経っていれば自動で再読み込み
  let last = Date.now();
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden && Date.now() - last > 10 * 60 * 1000) { last = Date.now(); load(false); }
  });
  load(true);
})();
</script>
</body>
</html>
